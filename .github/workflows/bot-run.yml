name: Bot Run (Scheduled)

on:
  schedule:
    - cron: "0 * * * *" # Every hour
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # Give the action permission to push back to the repo
    permissions:
      contents: write

    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install dependencies
        working-directory: ./dashboard
        run: npm ci

      - name: 🤖 Run Bot (Headless)
        working-directory: ./dashboard
        run: npx tsx scripts/headless.ts
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          BYTEZ_API_KEY: ${{ secrets.BYTEZ_API_KEY }}
          BYTEZ_ENABLED: "true"
          BOT_RUNNING: "true"

      - name: 💾 Persist State (Git-as-a-DB)
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"

          # Check if there are changes to commit
          git add dashboard/activity.json dashboard/replied_ids.json

          if git diff --staged --quiet; then
            echo "No changes to state files. Skipping commit."
            exit 0
          fi

          # Stash the changes temporarily
          git stash

          # Pull latest from remote
          git pull origin main

          # Re-apply our changes
          git stash pop

          # Add and commit
          git add dashboard/activity.json dashboard/replied_ids.json
          git commit -m "🤖 Update activity logs [skip ci]"

          # Push with retry
          for i in 1 2 3; do
            if git push origin main; then
              echo "Push successful!"
              exit 0
            fi
            echo "Push failed, attempt $i. Pulling and retrying..."
            git pull --rebase origin main
          done

          echo "Failed to push after 3 attempts"
          exit 1
